[project]
name = "buyma-price-competitor"
version = "1.0.0"
description = "BUYMA price competition automation using public product pages and Personal Shopper API"
requires-python = ">=3.11"
dependencies = [
    "gspread>=6.2.1",
    "google-auth>=2.40.0",
    "pandas>=2.2.3",
    "playwright>=1.55.0",
    "python-dotenv>=1.2.1",
    "PyYAML>=6.0.2",
    "requests>=2.32.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "ngrok>=1.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app/src"]
