name: Python checks

on:
  push:
    branches: ["main", "refactor/simplify-price-workflow"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync
      - name: Compile Python files
        run: uv run python -m compileall -q app buyma_price_manager.py refresh_prices.py setup_once.py migration.py payload_migration.py
      - name: Run unit tests
        run: uv run pytest app/tests -q
