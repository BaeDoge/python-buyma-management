name: Python checks

on:
  push:
    branches: ["main", "refactor/simplify-price-workflow", "feat/scheduled-exe-application-history"]
  pull_request:
    branches: ["main", "refactor/official-api-report-sheet"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync
      - name: Compile Python files
        run: uv run python -m compileall -q app buyma_price_manager.py buyma_price_scheduler.py
      - name: Run unit tests
        run: uv run pytest app/tests -q
