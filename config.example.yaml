# 실제 설정 파일은 이 파일을 config.yaml로 복사해서 사용합니다.

app:
  own_seller:
    name: "BestShip"
    id: "12217668"

  price:
    delta: 10       # 경쟁 최저가보다 낮출 금액(JPY)
    max_change: 50  # 한 번에 내릴 수 있는 최대 금액(JPY)

  browser:
    executable_paths:
      - "C:/Program Files/Google/Chrome/Application/chrome.exe"
      - "C:/Program Files (x86)/Google/Chrome/Application/chrome.exe"

google:
  sheet_url: "YOUR_GOOGLE_SHEET_URL"
  price_sheet: "[2]최저가"
  result_sheet: "api 가격변경 시트"
  api_history_sheet: "[6] 최저가 적용이력-공식API"
  application_history_sheet: "api 가격변경 시트 이력"
  url_column: "URL"

paths:
  google_service_account: "secrets/service_account.json"
  buyma_tokens: "secrets/tokens.json"
